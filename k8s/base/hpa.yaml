apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: docpipe-api
  namespace: docpipe
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: docpipe-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 65}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # OCR traffic is bursty; don't flap
