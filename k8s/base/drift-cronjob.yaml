# Hourly drift check over the last 24 h of inference logs. Writes
# /data/reports/drift_latest.json and, on "retrain", /data/reports/retrain_trigger.json.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: docpipe-drift
  namespace: docpipe
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: drift
              image: ghcr.io/OWNER/docpipe-train:0.1.0
              command: ["python", "-m", "docpipe.monitoring.drift", "--window-hours", "24"]
              envFrom: [{configMapRef: {name: docpipe-config}}]
              volumeMounts:
                - {name: data, mountPath: /data}
                - {name: cfg, mountPath: /app/configs/drift.yaml, subPath: drift.yaml}
              resources:
                requests: {cpu: 200m, memory: 512Mi}
                limits:   {cpu: "1",  memory: 1Gi}
          volumes:
            - name: data
              persistentVolumeClaim: {claimName: docpipe-data}
            - name: cfg
              configMap: {name: docpipe-config}
