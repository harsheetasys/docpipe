<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="470" viewBox="0 0 1040 470" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <style>
      .box{fill:#ffffff;stroke:#334155;stroke-width:1.4;rx:8}
      .lane{fill:#f1f5f9;stroke:none;rx:12}
      .t{fill:#0f172a}
      .s{fill:#475569;font-size:11px}
      .h{fill:#0f172a;font-weight:600;font-size:14px}
      .ar{stroke:#475569;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .acc{fill:#fff7ed;stroke:#c2410c}
      .green{fill:#f0fdf4;stroke:#15803d}
      .blue{fill:#eff6ff;stroke:#1d4ed8}
    </style>
  </defs>

  <!-- lanes -->
  <rect class="lane" x="12" y="12" width="1016" height="140"/>
  <text class="h" x="24" y="34">OFFLINE  ·  data → models</text>
  <rect class="lane" x="12" y="166" width="1016" height="130"/>
  <text class="h" x="24" y="188">ONLINE  ·  serving</text>
  <rect class="lane" x="12" y="310" width="1016" height="148"/>
  <text class="h" x="24" y="332">MONITOR  ·  drift → retrain → gate  /  rollback</text>

  <!-- offline -->
  <rect class="box" x="24" y="52" width="130" height="78"/>
  <text class="t" x="34" y="74">raw scans + labels</text>
  <text class="s" x="34" y="92">SROIE 626 receipts</text>
  <text class="s" x="34" y="108">img / box / key</text>

  <rect class="box blue" x="184" y="52" width="140" height="78"/>
  <text class="t" x="194" y="74">Spark prep</text>
  <text class="s" x="194" y="92">weak labels (UDF)</text>
  <text class="s" x="194" y="108">hash split · SQL gates</text>

  <rect class="box" x="354" y="52" width="130" height="78"/>
  <text class="t" x="364" y="74">lake (parquet)</text>
  <text class="s" x="364" y="92">lines · docs</text>
  <text class="s" x="364" y="108">YOLO export 25/50/100%</text>

  <rect class="box blue" x="514" y="52" width="150" height="78"/>
  <text class="t" x="524" y="74">training</text>
  <text class="s" x="524" y="92">YOLOv8n detector</text>
  <text class="s" x="524" y="108">U-Net · OCR benchmark</text>

  <rect class="box acc" x="694" y="52" width="150" height="78"/>
  <text class="t" x="704" y="74">MLflow</text>
  <text class="s" x="704" y="92">runs · artifacts</text>
  <text class="s" x="704" y="108">registry: challenger</text>

  <rect class="box green" x="874" y="52" width="140" height="78"/>
  <text class="t" x="884" y="74">promotion gate</text>
  <text class="s" x="884" y="92">beats champion?</text>
  <text class="s" x="884" y="108">no field regressed?</text>

  <rect class="box" x="354" y="2" width="0" height="0"/>
  <rect class="box" x="184" y="136" width="300" height="0"/>

  <path class="ar" d="M154,91 L184,91"/>
  <path class="ar" d="M324,91 L354,91"/>
  <path class="ar" d="M484,91 L514,91"/>
  <path class="ar" d="M664,91 L694,91"/>
  <path class="ar" d="M844,91 L874,91"/>

  <!-- feature store (below lake) -->
  <rect class="box blue" x="354" y="118" width="130" height="30"/>
  <text class="s" x="364" y="137">feature store · reference</text>

  <!-- online -->
  <rect class="box" x="24" y="206" width="110" height="70"/>
  <text class="t" x="34" y="228">POST /predict</text>
  <text class="s" x="34" y="246">image</text>

  <rect class="box blue" x="164" y="206" width="560" height="70"/>
  <text class="t" x="176" y="228">FastAPI pod ×N  (K8s Deployment · HPA · PDB · readiness = model loaded)</text>
  <text class="s" x="176" y="248">doc features → YOLOv8n detect → OCR field lines (+ fallback) → post-process → fields</text>
  <text class="s" x="176" y="264">U-Net text coverage · Prometheus /metrics · inference log (features + preds, no images)</text>

  <rect class="box acc" x="754" y="206" width="120" height="70"/>
  <text class="t" x="764" y="228">registry</text>
  <text class="s" x="764" y="246">@champion</text>
  <text class="s" x="764" y="262">refresh every 60 s</text>

  <rect class="box" x="904" y="206" width="110" height="70"/>
  <text class="t" x="914" y="228">fields JSON</text>
  <text class="s" x="914" y="246">company · date</text>
  <text class="s" x="914" y="262">address · total</text>

  <path class="ar" d="M134,241 L164,241"/>
  <path class="ar" d="M754,241 L724,241"/>
  <path class="ar" d="M874,241 L904,241"/>
  <path class="ar" d="M944,130 L944,160 L814,160 L814,206"/>

  <!-- monitor -->
  <rect class="box" x="24" y="350" width="150" height="92"/>
  <text class="t" x="34" y="372">inference log</text>
  <text class="s" x="34" y="390">brightness · blur ·</text>
  <text class="s" x="34" y="406">det conf · fields found</text>
  <text class="s" x="34" y="422">model version</text>

  <rect class="box blue" x="204" y="350" width="190" height="92"/>
  <text class="t" x="214" y="372">drift job (hourly CronJob)</text>
  <text class="s" x="214" y="390">PSI + KS vs feature-store ref</text>
  <text class="s" x="214" y="406">confidence drop vs baseline</text>
  <text class="s" x="214" y="422">ok · warn · retrain · rollback</text>

  <rect class="box green" x="424" y="350" width="170" height="92"/>
  <text class="t" x="434" y="372">retrain (nightly CronJob)</text>
  <text class="s" x="434" y="390">only if trigger present</text>
  <text class="s" x="434" y="406">rebuild lake → train</text>
  <text class="s" x="434" y="422">→ challenger → gate</text>

  <rect class="box acc" x="624" y="350" width="180" height="92"/>
  <text class="t" x="634" y="372">rollback paths</text>
  <text class="s" x="634" y="390">model: champion ← previous</text>
  <text class="s" x="634" y="406">deploy: kubectl rollout undo</text>
  <text class="s" x="634" y="422">audit: promotions.jsonl</text>

  <rect class="box" x="834" y="350" width="180" height="92"/>
  <text class="t" x="844" y="372">observability</text>
  <text class="s" x="844" y="390">Prometheus histograms</text>
  <text class="s" x="844" y="406">DuckDB SQL analytics</text>
  <text class="s" x="844" y="422">MLflow UI</text>

  <path class="ar" d="M174,396 L204,396"/>
  <path class="ar" d="M394,396 L424,396"/>
  <path class="ar" d="M594,396 L624,396"/>
  <path class="ar" d="M444,276 L444,310 L99,310 L99,350"/>
  <path class="ar" d="M509,350 L509,302 L739,302 L739,170 L589,170 L589,130"/>
</svg>
